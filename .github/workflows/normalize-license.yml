name: Normalize GPL license

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-license.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch canonical GPL-3.0-only text
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt \
            --output LICENSE
          rm .github/workflows/normalize-license.yml

      - name: Commit canonical license
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LICENSE .github/workflows/normalize-license.yml
          git commit -m 'docs: normalize GPL-3.0-only text'
          git push
