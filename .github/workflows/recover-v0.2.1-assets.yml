name: Recover v0.2.1 release assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-v0.2.1-assets.yml

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.2.1
      publish: true
    secrets: inherit
