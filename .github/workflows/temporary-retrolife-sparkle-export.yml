name: Temporary RetroLife Sparkle key export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Export the RetroLife Sparkle account into its protected secret
        env:
          MAC_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
          RELAY_TOKEN: ${{ secrets.INPUTMATE_RELAY_TOKEN }}
          TARGET_PUBLIC_KEY: 0B27FpWNYuFx8Z0VZ6p43aLMWAtK8xzOqDY8GRfZIW8=
        shell: bash
        run: |
          set -euo pipefail
          keychain=/Users/lincolnaleixo/Library/Keychains/login.keychain-db
          export_file=$(/usr/bin/mktemp /tmp/retrolife-sparkle-private.XXXXXX)
          export_log=$(/usr/bin/mktemp /tmp/retrolife-sparkle-export-log.XXXXXX)
          direct_file=$(/usr/bin/mktemp /tmp/retrolife-sparkle-direct.XXXXXX)
          direct_log=$(/usr/bin/mktemp /tmp/retrolife-sparkle-direct-log.XXXXXX)
          trap '/bin/rm -f "$export_file" "$export_log" "$direct_file" "$direct_log"; /usr/bin/security lock-keychain "$keychain" >/dev/null 2>&1 || true; unset MAC_BUILD_KEYCHAIN_PASSWORD RELAY_TOKEN' EXIT
          /usr/bin/python3 - <<'PY'
          import subprocess
          import sys

          script = '''
          tell application "System Events"
            tell process "SecurityAgent"
              if (count of windows) is 0 then error "no authorization dialog"
              set password_value to do shell script "/usr/bin/printenv MAC_BUILD_KEYCHAIN_PASSWORD"
              set value of text field 2 of window 1 to password_value
              click button "Modify Keychain" of window 1
              return "RETROLIFE_GUI_AUTH=approved"
            end tell
          end tell
          '''
          try:
              result = subprocess.run(
                  ["/usr/bin/osascript"],
                  input=script,
                  text=True,
                  capture_output=True,
                  timeout=20,
                  check=False,
              )
          except subprocess.TimeoutExpired:
              print("RETROLIFE_GUI_AUTH=timeout")
              raise SystemExit(2)
          if result.returncode != 0:
              print("RETROLIFE_GUI_AUTH=failed")
              raise SystemExit(1)
          sys.stdout.write(result.stdout)
          PY
          /bin/sleep 2
          set +e
          /usr/local/libexec/retrolife-signing/Sparkle-2.10.0/bin/generate_keys \
            --account io.github.lincolnaleixo.retrolife.sparkle \
            -x "$export_file" > "$export_log" 2>&1
          export_status=$?
          set -e
          export_bytes=$(wc -c < "$export_file" | tr -d ' ')
          export_log_bytes=$(wc -c < "$export_log" | tr -d ' ')
          echo RETROLIFE_EXPORT_STATUS="$export_status"
          echo RETROLIFE_EXPORT_BYTES="$export_bytes"
          echo RETROLIFE_EXPORT_LOG_BYTES="$export_log_bytes"
          source_file="$export_file"
          if [ "$export_status" -ne 0 ]; then
            set +e
            /usr/bin/security find-generic-password \
              -a io.github.lincolnaleixo.retrolife.sparkle \
              -s 'https://sparkle-project.org' \
              -w > "$direct_file" 2> "$direct_log"
            direct_status=$?
            set -e
            direct_bytes=$(wc -c < "$direct_file" | tr -d ' ')
            direct_log_bytes=$(wc -c < "$direct_log" | tr -d ' ')
            echo RETROLIFE_DIRECT_STATUS="$direct_status"
            echo RETROLIFE_DIRECT_BYTES="$direct_bytes"
            echo RETROLIFE_DIRECT_LOG_BYTES="$direct_log_bytes"
            if [ "$direct_status" -ne 0 ]; then
              exit 0
            fi
            source_file="$direct_file"
          fi
          test -s "$source_file"
          /usr/bin/python3 - "$source_file" "$TARGET_PUBLIC_KEY" <<'PY'
          import base64
          import sys
          from pathlib import Path

          value = Path(sys.argv[1]).read_text(encoding="utf-8").strip()
          expected_public = sys.argv[2]
          try:
              decoded = base64.b64decode(value, validate=True)
          except (ValueError, TypeError):
              print("RETROLIFE_KEY_FORMAT=invalid")
              raise SystemExit(1)
          canonical = base64.b64encode(decoded).decode() == value
          public_match = base64.b64encode(decoded[-32:]).decode() == expected_public
          print(f"RETROLIFE_KEY_BYTES={len(decoded)}")
          print(f"RETROLIFE_KEY_CANONICAL={str(canonical).lower()}")
          print(f"RETROLIFE_KEY_PUBLIC_MATCH={str(public_match).lower()}")
          if not canonical or not public_match or len(decoded) not in (64, 96):
              raise SystemExit(1)
          PY
          GH_TOKEN="$RELAY_TOKEN" /opt/homebrew/bin/gh secret set SPARKLE_PRIVATE_KEY \
            --repo lincolnaleixo/retrolife --env macos-release < "$source_file"
          echo RETROLIFE_SPARKLE_SECRET=installed
