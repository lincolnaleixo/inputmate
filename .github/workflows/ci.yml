name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run policy tests
        run: swift run InputMateTests

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: '-'
        run: zsh scripts/build-app.sh

      - name: Verify app bundle
        shell: bash
        run: |
          app=.build/app/InputMate.app
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          test -f "$app/Contents/Resources/LICENSE"
          codesign --verify --deep --strict --verbose=2 "$app"
          otool -L "$app/Contents/MacOS/InputMate" |
            grep -F '@rpath/Sparkle.framework/'
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' "$app/Contents/Info.plist")" \
            = "https://github.com/lincolnaleixo/inputmate/releases/latest/download/appcast.xml"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$app/Contents/Info.plist")"

          grep -Fq \
            'com.apple.security.cs.disable-library-validation' \
            App/InputMate.debug.entitlements
          if grep -Fq \
            'com.apple.security.cs.disable-library-validation' \
            App/InputMate.release.entitlements; then
            echo 'Release entitlements must keep Library Validation enabled' >&2
            exit 1
          fi

          signed_entitlements="$(codesign -d --entitlements :- "$app" 2>&1 || true)"
          grep -Fq \
            'com.apple.security.cs.disable-library-validation' \
            <<< "$signed_entitlements"

      - name: Verify DMG installer
        shell: bash
        run: |
          dmg=.build/app/InputMate-test.dmg
          zsh scripts/create-dmg.sh .build/app/InputMate.app "$dmg"
          hdiutil verify "$dmg" >/dev/null

          mount_dir="$(mktemp -d)"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            fi
            rm -rf "$mount_dir" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          hdiutil attach "$dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_dir" >/dev/null
          mounted=true

          test -d "$mount_dir/InputMate.app"
          test -L "$mount_dir/Applications"
          test "$(readlink "$mount_dir/Applications")" = "/Applications"
          codesign --verify --deep --strict --verbose=2 \
            "$mount_dir/InputMate.app"

          hdiutil detach "$mount_dir" >/dev/null
          mounted=false
          rm -rf "$mount_dir"
          trap - EXIT

      - name: Verify Homebrew cask
        env:
          HOMEBREW_NO_ASK: '1'
          HOMEBREW_NO_AUTO_UPDATE: '1'
        shell: bash
        run: |
          version="$(awk -F'"' '/^  version / { print $2 }' Casks/inputmate.rb)"
          checksum="$(awk -F'"' '/^  sha256 / { print $2 }' Casks/inputmate.rb)"
          test -n "$version"
          test -n "$checksum"

          zsh scripts/update-homebrew-cask.sh "$version" "$checksum"
          git diff --exit-code -- Casks/inputmate.rb
          brew style Casks/inputmate.rb

          tap_name=lincolnaleixo/inputmate
          cask_name="$tap_name/inputmate"
          tapped=false
          installed=false
          cleanup() {
            if [[ "$installed" == true ]]; then
              brew uninstall --cask "$cask_name" >/dev/null 2>&1 || true
            fi
            if [[ "$tapped" == true ]]; then
              brew untap "$tap_name" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            brew tap "$tap_name" "https://github.com/$GITHUB_REPOSITORY"
          else
            brew tap-new "$tap_name"
            tap_dir="$(brew --repository "$tap_name")"
            mkdir -p "$tap_dir/Casks"
            cp Casks/inputmate.rb "$tap_dir/Casks/inputmate.rb"
          fi
          tapped=true

          brew install --cask "$cask_name"
          installed=true
          test -d /Applications/InputMate.app
          installed_version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              /Applications/InputMate.app/Contents/Info.plist
          )"
          test "$installed_version" = "$version"

          brew uninstall --cask "$cask_name"
          installed=false
          brew untap "$tap_name"
          tapped=false
          trap - EXIT

      - name: Verify signed appcast generation
        run: zsh scripts/test-appcast.sh
