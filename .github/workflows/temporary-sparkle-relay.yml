name: Temporary Sparkle secret relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Copy the protected secret through GitHub's secret API
        env:
          RELAY_TOKEN: ${{ secrets.INPUTMATE_RELAY_TOKEN }}
          SOURCE_SECRET: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELAY_TOKEN"
          test -n "$SOURCE_SECRET"
          printf '%s' "$SOURCE_SECRET" |
            GH_TOKEN="$RELAY_TOKEN" gh secret set SPARKLE_PRIVATE_KEY \
              --repo lincolnaleixo/retrolife --env macos-release
          unset SOURCE_SECRET RELAY_TOKEN
          echo RELAY_STATUS=complete
