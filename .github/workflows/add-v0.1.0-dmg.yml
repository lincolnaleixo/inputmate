name: Add DMG to v0.1.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-v0.1.0-dmg.yml

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish-dmg:
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download the exact signed release app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p existing
          gh release download v0.1.0 \
            --pattern InputMate.app.zip \
            --pattern InputMate.app.zip.sha256 \
            --dir existing
          (
            cd existing
            shasum -a 256 -c InputMate.app.zip.sha256
          )

      - name: Create drag-to-Applications DMG
        shell: bash
        run: |
          mkdir -p extracted dist
          ditto -x -k existing/InputMate.app.zip extracted
          app_path="$(
            find extracted -type d -name InputMate.app -print -quit
          )"
          if [[ -z "$app_path" ]]; then
            echo "InputMate.app was not found in the release ZIP." >&2
            exit 1
          fi

          version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$app_path/Contents/Info.plist"
          )"
          test "$version" = "0.1.0"
          codesign --verify --deep --strict --verbose=2 "$app_path"

          zsh scripts/create-dmg.sh "$app_path" dist/InputMate.dmg
          (
            cd dist
            shasum -a 256 InputMate.dmg > InputMate.dmg.sha256
          )

      - name: Publish and verify DMG assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload v0.1.0 \
            dist/InputMate.dmg \
            dist/InputMate.dmg.sha256 \
            --clobber

          release_assets="$(
            gh release view v0.1.0 --json assets --jq '.assets[].name'
          )"
          grep -qx 'InputMate.dmg' <<< "$release_assets"
          grep -qx 'InputMate.dmg.sha256' <<< "$release_assets"

          mkdir -p published
          gh release download v0.1.0 \
            --pattern InputMate.dmg \
            --pattern InputMate.dmg.sha256 \
            --dir published
          (
            cd published
            shasum -a 256 -c InputMate.dmg.sha256
          )

      - name: Report completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          dmg_sha256="$(shasum -a 256 dist/InputMate.dmg | cut -d' ' -f1)"
          gh pr comment 7 --body \
            "DMG publication completed: \`InputMate.dmg\` and \`InputMate.dmg.sha256\` are attached to release \`v0.1.0\`. SHA-256: \`$dmg_sha256\`. The existing signed Sparkle ZIP and appcast were left unchanged."
