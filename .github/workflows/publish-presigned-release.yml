name: Publish Pre-Signed Release

on:
  push:
    branches:
      - main
    paths:
      - release/appcast.xml
      - release/source-run-id.txt
      - .github/workflows/publish-presigned-release.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve artifact metadata
        id: metadata
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          RUN_ID="$(tr -d '[:space:]' < release/source-run-id.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid workflow run ID: $RUN_ID" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=inputmate-v$VERSION-source" >> "$GITHUB_OUTPUT"

      - name: Download exact macOS release artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.metadata.outputs.run_id }}

      - name: Verify release payload and signed appcast
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          test -f dist/InputMate.app.zip
          test -f dist/InputMate.app.zip.sha256
          test -f release/appcast.xml
          (
            cd dist
            sha256sum -c InputMate.app.zip.sha256
          )

          ARCHIVE_LENGTH="$(stat -c '%s' dist/InputMate.app.zip)"
          grep -Fq \
            "releases/download/$RELEASE_TAG/InputMate.app.zip" \
            release/appcast.xml
          grep -Fq "length=\"$ARCHIVE_LENGTH\"" release/appcast.xml
          grep -Fq 'sparkle:edSignature=' release/appcast.xml
          grep -Fq '<!-- sparkle-signatures:' release/appcast.xml

      - name: Replace GitHub Release assets with the signed payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/InputMate.app.zip \
            dist/InputMate.app.zip.sha256 \
            release/appcast.xml \
            --clobber

          ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in InputMate.app.zip InputMate.app.zip.sha256 appcast.xml; do
            grep -qx "$asset" <<< "$ASSETS"
          done

      - name: Report successful signed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        shell: bash
        run: |
          RELEASE_URL="$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          ARCHIVE_SHA256="$(sha256sum dist/InputMate.app.zip | cut -d' ' -f1)"
          gh pr comment 6 --body \
            "release-publish-run:${GITHUB_RUN_ID} tag:${RELEASE_TAG} sha256:${ARCHIVE_SHA256} status:success url:${RELEASE_URL}"
