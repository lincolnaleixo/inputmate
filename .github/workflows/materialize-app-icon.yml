name: Materialize app icon

on:
  push:
    branches:
      - feat/app-icon
    paths:
      - .github/workflows/materialize-app-icon.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/app-icon

      - name: Materialize PNG asset
        shell: bash
        run: |
          set -euo pipefail
          cat App/IconPayload/part-* | base64 --decode > App/InputMateIcon.png
          echo '5ecab30d0cbeab5b0b5828688d0d14dba8f26032728e82c1345843dd4f5bcd58  App/InputMateIcon.png' |
            sha256sum --check

          python3 - <<'PY'
          from pathlib import Path
          import struct

          data = Path('App/InputMateIcon.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          width, height = struct.unpack('>II', data[16:24])
          assert (width, height) == (512, 512), (width, height)
          PY

          rm -rf App/IconPayload

      - name: Commit binary icon asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/InputMateIcon.png App/IconPayload
          git commit -m 'chore(branding): materialize app icon asset'
          git push origin HEAD:feat/app-icon
