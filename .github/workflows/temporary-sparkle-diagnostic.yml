name: Temporary Sparkle signing diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sparkle:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Run the host Sparkle step against the existing artifact
        env:
          MAC_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain=/Users/lincolnaleixo/Library/Keychains/login.keychain-db
          cleanup() {
            /usr/bin/security lock-keychain "$keychain" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          /usr/bin/security lock-keychain "$keychain"
          /usr/bin/expect <<'EOF'
          log_user 0
          set timeout 30
          set password $::env(MAC_BUILD_KEYCHAIN_PASSWORD)
          set keychain [file normalize "/Users/lincolnaleixo/Library/Keychains/login.keychain-db"]
          spawn security unlock-keychain $keychain
          expect {
            -re "(?i)password.*:" { send -- "$password\r"; exp_continue }
            eof {}
            timeout { exit 2 }
          }
          set result [wait]
          exit [lindex $result 3]
          EOF
          export MACOS_KEYCHAIN_PASSWORD="$MAC_BUILD_KEYCHAIN_PASSWORD"
          unset MAC_BUILD_KEYCHAIN_PASSWORD
          python3 - <<'PY'
          import plistlib
          import runpy
          import subprocess
          import sys
          from pathlib import Path

          root = Path("/Users/lincolnaleixo/actions-runner-retrolife/_work/retrolife/retrolife")
          app = root / "dist/unsigned/RetroLife.app"
          archive = root / "dist/unsigned/RetroLife-macos-arm64.zip"
          helper = Path("/usr/local/libexec/retrolife-sign-release")
          if not app.is_dir() or not archive.is_file():
              print("SPARKLE_RESULT=missing-artifact")
              sys.exit(2)
          data = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          info = {
              "version": data["RLReleaseVersion"],
              "tag": "v" + data["RLReleaseVersion"],
              "bundleVersion": data["CFBundleVersion"],
              "shortVersion": data["CFBundleShortVersionString"],
              "channel": "beta",
          }
          module = runpy.run_path(str(helper))
          configured = False
          try:
              original_default, original_keychains = module["keychain_state"]()
              module["ORIGINAL_DEFAULT"] = original_default
              module["ORIGINAL_KEYCHAINS"] = original_keychains
              configured = True
              module["unlock_keychain"]()
              module["set_signing_keychain"]()
              sdk = module["SPARKLE_SDK"]
              env = module["CLEAN_ENV"]
              generate = subprocess.run(
                  [str(sdk / "bin/generate_keys"), "--account", module["SPARKLE_ACCOUNT"], "-p"],
                  cwd=module["ROOT"], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              generated = generate.stdout.decode("utf-8", "replace").strip()
              print("GENERATE_KEYS_RC=" + str(generate.returncode))
              print("GENERATE_KEY_MATCH=" + ("yes" if generated == data["SUPublicEDKey"] else "no"))
              sign = subprocess.run(
                  [str(sdk / "bin/sign_update"), "--account", module["SPARKLE_ACCOUNT"], "-p", str(archive)],
                  cwd=module["ROOT"], env=env, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
              )
              stderr = sign.stderr.decode("utf-8", "replace").lower()
              print("SIGN_UPDATE_RC=" + str(sign.returncode))
              print("SIGN_STDOUT_BYTES=" + str(len(sign.stdout)))
              print("SIGN_STDERR_BYTES=" + str(len(sign.stderr)))
              for label, pattern in (
                  ("keychain", "keychain"), ("permission", "permission"),
                  ("access", "access"), ("interaction", "interaction"),
                  ("denied", "denied"), ("account", "account"),
                  ("private-key", "private key"), ("not-found", "not found"),
              ):
                  print("SIGN_ERROR_" + label.upper().replace("-", "_") + "=" + ("yes" if pattern in stderr else "no"))
              if sign.returncode:
                  sys.exit(1)
          finally:
              if configured:
                  module["restore_keychain"]()
          print("SPARKLE_RESULT=success")
          PY
