name: Temporary Sparkle stdin diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Test protected Sparkle stdin signing
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          archive=$(/usr/bin/mktemp /tmp/retrolife-sparkle-diagnostic.XXXXXX)
          signature=$(/usr/bin/mktemp /tmp/retrolife-sparkle-signature.XXXXXX)
          error_log=$(/usr/bin/mktemp /tmp/retrolife-sparkle-error.XXXXXX)
          trap '/bin/rm -f "$archive" "$signature" "$error_log"' EXIT
          /usr/bin/printf diagnostic > "$archive"
          test -n "$SPARKLE_PRIVATE_KEY"
          set +e
          /usr/bin/printf '%s' "$SPARKLE_PRIVATE_KEY" |
            /usr/local/libexec/retrolife-signing/Sparkle-2.10.0/bin/sign_update \
              --ed-key-file - -p "$archive" > "$signature" 2> "$error_log"
          sign_status=$?
          set -e
          sig=$(tr -d '\n' < "$signature")
          signature_bytes=$(wc -c < "$signature" | tr -d ' ')
          error_bytes=$(wc -c < "$error_log" | tr -d ' ')
          echo SPARKLE_SIGN_STATUS="$sign_status"
          echo SPARKLE_SIGNATURE_BYTES="$signature_bytes"
          echo SPARKLE_ERROR_BYTES="$error_bytes"
          if [ "$sign_status" -eq 0 ]; then
            set +e
            /usr/bin/printf '%s' "$SPARKLE_PRIVATE_KEY" |
              /usr/local/libexec/retrolife-signing/Sparkle-2.10.0/bin/sign_update \
                --ed-key-file - --verify "$archive" "$sig" >/dev/null 2>&1
            verify_status=$?
            set -e
            echo SPARKLE_VERIFY_STATUS="$verify_status"
          fi
