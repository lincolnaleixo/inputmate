name: Temporary keychain unlock diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unlock:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Compare InputMate and host-helper unlock paths
        env:
          MAC_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain=/Users/lincolnaleixo/Library/Keychains/login.keychain-db
          cleanup() {
            /usr/bin/security lock-keychain "$keychain" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          /usr/bin/sudo -k
          if printf '%s\n' "$MAC_BUILD_KEYCHAIN_PASSWORD" | /usr/bin/sudo -S -k -p '' -v >/dev/null 2>&1; then
            echo SUDO_PASSWORD=accepted
          else
            echo SUDO_PASSWORD=rejected
            exit 2
          fi
          /usr/bin/sudo -k

          helper=/usr/local/libexec/retrolife-sign-release
          backup=/usr/local/libexec/retrolife-sign-release.backup-20260916
          fixed="$RUNNER_TEMP/retrolife-sign-release.fixed"
          cp "$backup" "$fixed"
          perl -0pi -e 's/capture_output=True, text=True/capture_output=True, text=True, encoding="utf-8", errors="replace"/g; s/"-c", script, str\(KEYCHAIN\)/"-c", script, "--", str(KEYCHAIN)/g' "$fixed"
          grep -Fq 'errors="replace"' "$fixed"
          printf '%s\n' "$MAC_BUILD_KEYCHAIN_PASSWORD" | /usr/bin/sudo -S -p '' -v >/dev/null 2>&1
          if [[ ! -e "$backup" ]]; then
            /usr/bin/sudo -n cp -p "$helper" "$backup"
          fi
          /usr/bin/sudo -n install -o root -g wheel -m 0755 "$fixed" "$helper"
          /usr/bin/sudo -n /usr/bin/python3 -c 'from pathlib import Path; p=Path("/usr/local/libexec/retrolife-sign-release"); compile(p.read_text(), str(p), "exec")'
          /usr/bin/sudo -k
          echo HOST_HELPER_PATCH=installed

          /usr/bin/security lock-keychain "$keychain"
          /usr/bin/expect <<'EOF'
          log_user 0
          set timeout 30
          set password $::env(MAC_BUILD_KEYCHAIN_PASSWORD)
          set keychain [file normalize "/Users/lincolnaleixo/Library/Keychains/login.keychain-db"]
          spawn security unlock-keychain $keychain
          expect {
            -re "(?i)password.*:" {
              send -- "$password\r"
              exp_continue
            }
            eof {}
            timeout { exit 2 }
          }
          set result [wait]
          exit [lindex $result 3]
          EOF
          echo DIRECT_EXPECT=success
          /usr/bin/security show-keychain-info "$keychain" >/dev/null
          /usr/bin/security lock-keychain "$keychain"
          /usr/bin/expect -c 'puts "EXPECT_ARGCOUNT=[llength $argv]"; puts "EXPECT_ARG0=[lindex $argv 0]"' -- "$keychain"
          if /usr/bin/security show-keychain-info "$keychain" >/dev/null 2>&1; then
            echo BEFORE_PYTHON=unlocked
          else
            echo BEFORE_PYTHON=locked
          fi

          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          keychain = "/Users/lincolnaleixo/Library/Keychains/login.keychain-db"
          protected = {
              "MACOS_KEYCHAIN_PASSWORD", "MACOS_CERTIFICATE_P12_BASE64",
              "MACOS_CERTIFICATE_PASSWORD", "APPLE_ID", "APPLE_APP_PASSWORD",
              "APPLE_API_KEY_ID", "APPLE_API_ISSUER_ID", "APPLE_API_KEY_P8_BASE64",
              "SPARKLE_PRIVATE_KEY", "GH_TOKEN", "GITHUB_TOKEN",
          }
          clean = {key: value for key, value in os.environ.items()
                   if key not in protected}
          clean["MACOS_KEYCHAIN_PASSWORD"] = os.environ["MAC_BUILD_KEYCHAIN_PASSWORD"]
          script = r'''
          set timeout 30
          log_user 0
          spawn /usr/bin/security unlock-keychain [lindex $argv 0]
          expect {
              -re {(?i)password.*:} { send -- "$env(MACOS_KEYCHAIN_PASSWORD)\r"; exp_continue }
              eof {}
              timeout { exit 2 }
          }
          set result [wait]
          puts "EXPECT_CHILD_EXIT=[lindex $result 3]"
          exit [lindex $result 3]
          '''
          result = subprocess.run(
              ["/usr/bin/expect", "-c", script, "--", keychain],
              cwd="/Users/lincolnaleixo/actions-runner-retrolife/_work/retrolife/retrolife",
              env=clean,
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          if result.returncode:
              match = re.search(r"EXPECT_CHILD_EXIT=([0-9]+)", result.stdout or "")
              print("PYTHON_CHILD_EXIT=" + (match.group(1) if match else "missing"))
              print("PYTHON_RC=" + str(result.returncode))
              print("PYTHON_HELPER_EXPECT=failed exit=" + str(result.returncode))
              sys.exit(1)
          match = re.search(r"EXPECT_CHILD_EXIT=([0-9]+)", result.stdout or "")
          print("PYTHON_CHILD_EXIT=" + (match.group(1) if match else "missing"))
          print("PYTHON_RC=" + str(result.returncode))
          print("PYTHON_HELPER_EXPECT=success")
          PY
          /usr/bin/security show-keychain-info "$keychain" >/dev/null
