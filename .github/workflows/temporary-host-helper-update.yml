name: Temporary host helper update

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Install the fixed host signer
        env:
          MAC_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          fixed=/tmp/retrolife-sign-release.fixed
          helper=/usr/local/libexec/retrolife-sign-release
          test -s "$fixed"
          printf '%s\n' "$MAC_BUILD_KEYCHAIN_PASSWORD" |
            sudo -S -p '' -v >/dev/null 2>&1
          sudo -n install -o root -g wheel -m 0755 "$fixed" "$helper"
          sudo -n /usr/bin/python3 -c \
            'from pathlib import Path; compile(Path("/usr/local/libexec/retrolife-sign-release").read_text(), "retrolife-sign-release", "exec")'
          rm -f "$fixed"
          sudo -k
          echo HELPER_UPDATE=installed
