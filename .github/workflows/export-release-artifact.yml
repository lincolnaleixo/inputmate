name: Export Release Artifact

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-release-artifact.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run policy tests
        run: swift run InputMateTests

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: '-'
          INPUTMATE_VERSION: ${{ steps.version.outputs.value }}
          INPUTMATE_BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: zsh scripts/build-app.sh

      - name: Package exact release candidate
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/app/InputMate.app \
            dist/InputMate.app.zip
          (
            cd dist
            shasum -a 256 InputMate.app.zip > InputMate.app.zip.sha256
          )

      - name: Upload exact release candidate
        uses: actions/upload-artifact@v4
        with:
          name: inputmate-v${{ steps.version.outputs.value }}-source
          path: |
            dist/InputMate.app.zip
            dist/InputMate.app.zip.sha256
          if-no-files-found: error
          retention-days: 2

      - name: Report artifact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 6 --body \
            "release-artifact-run:${GITHUB_RUN_ID} version:${{ steps.version.outputs.value }} sha:${GITHUB_SHA}"
