name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0, got: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Show Swift version
        run: swift --version

      - name: Run policy tests
        run: swift run InputMateTests

      - name: Set bundle version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" App/Info.plist

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: '-'
        run: zsh scripts/build-app.sh

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/app/InputMate.app \
            dist/InputMate.app.zip
          (
            cd dist
            shasum -a 256 InputMate.app.zip > InputMate.app.zip.sha256
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/InputMate.app.zip \
              dist/InputMate.app.zip.sha256 \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/InputMate.app.zip \
              dist/InputMate.app.zip.sha256 \
              --title "InputMate $GITHUB_REF_NAME" \
              --generate-notes
          fi
