name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - version.txt
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_call:
    inputs:
      tag:
        description: Existing semantic-version tag to publish
        required: false
        default: ''
        type: string
    secrets:
      SPARKLE_PRIVATE_KEY:
        description: Optional base64-encoded Sparkle Ed25519 private seed
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve release metadata
        id: release
        env:
          CALLED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ -n "$CALLED_TAG" ]]; then
            TAG="$CALLED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
            TAG="v$VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0, got: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Show Swift version
        run: swift --version

      - name: Run policy tests
        run: swift run InputMateTests

      - name: Build app bundle
        env:
          CODESIGN_IDENTITY: '-'
          INPUTMATE_VERSION: ${{ steps.release.outputs.version }}
          INPUTMATE_BUILD_VERSION: ${{ steps.release.outputs.version }}
        run: zsh scripts/build-app.sh

      - name: Package release
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/app/InputMate.app \
            dist/InputMate.app.zip
          zsh scripts/create-dmg.sh \
            .build/app/InputMate.app \
            dist/InputMate.dmg
          (
            cd dist
            shasum -a 256 InputMate.app.zip > InputMate.app.zip.sha256
            shasum -a 256 InputMate.dmg > InputMate.dmg.sha256
          )

      - name: Generate signed Sparkle appcast
        if: ${{ env.SPARKLE_PRIVATE_KEY != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          GENERATE_APPCAST="$(
            find "$GITHUB_WORKSPACE/.build/artifacts" \
              -type f -name generate_appcast -print -quit
          )"
          if [[ -z "$GENERATE_APPCAST" ]]; then
            echo "Sparkle generate_appcast tool was not found." >&2
            exit 1
          fi
          chmod +x "$GENERATE_APPCAST"

          mkdir -p dist/appcast-source
          cp dist/InputMate.app.zip dist/appcast-source/InputMate.app.zip

          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$GENERATE_APPCAST" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --full-release-notes-url \
                "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --link "https://github.com/$GITHUB_REPOSITORY" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
              "$GITHUB_WORKSPACE/dist/appcast-source"

          grep -Fq 'sparkle:edSignature=' dist/appcast.xml
          grep -Fq "$RELEASE_TAG/InputMate.app.zip" dist/appcast.xml

      - name: Preserve last signed Sparkle appcast
        id: preserved-feed
        if: ${{ env.SPARKLE_PRIVATE_KEY == '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          test -f release/appcast.xml
          grep -Fq 'sparkle:edSignature=' release/appcast.xml
          grep -Fq '<!-- sparkle-signatures:' release/appcast.xml
          cp release/appcast.xml dist/appcast.xml

          if grep -Fq \
            "releases/download/$RELEASE_TAG/InputMate.app.zip" \
            release/appcast.xml; then
            echo "references_current_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "references_current_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
          PRESERVED_FEED_REFERENCES_CURRENT_TAG: ${{ steps.preserved-feed.outputs.references_current_tag }}
        shell: bash
        run: |
          assets=(
            dist/InputMate.dmg
            dist/InputMate.dmg.sha256
          )

          if [[ -n "$SPARKLE_PRIVATE_KEY" || \
                "$PRESERVED_FEED_REFERENCES_CURRENT_TAG" != "true" ]]; then
            assets+=(
              dist/InputMate.app.zip
              dist/InputMate.app.zip.sha256
              dist/appcast.xml
            )
          else
            echo "Keeping the existing signed ZIP and appcast for $RELEASE_TAG."
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$RELEASE_SHA" \
              --title "InputMate $RELEASE_TAG" \
              --generate-notes
          fi

          release_assets="$(
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name'
          )"
          grep -qx 'InputMate.dmg' <<< "$release_assets"
          grep -qx 'InputMate.dmg.sha256' <<< "$release_assets"
