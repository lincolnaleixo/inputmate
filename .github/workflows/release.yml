name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Semantic-version tag created by Release Please
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag or blank for version.txt (verify only)
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: inputmate-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 75

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}

      - name: Resolve release metadata
        id: release
        env:
          CALLED_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ -n "$CALLED_TAG" ]]; then
            TAG="$CALLED_TAG"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION="$(tr -d '[:space:]' < version.txt)"
            TAG="v$VERSION"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0, got: $TAG" >&2
            exit 1
          fi

          PUBLISH=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_call ]]; then
            PUBLISH=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          {
            echo '## InputMate release'
            echo
            echo "- Version: ${TAG#v}"
            echo "- Source: $(git rev-parse HEAD)"
            if [[ "$PUBLISH" == true ]]; then
              echo '- Mode: publish signed and notarized release assets'
            else
              echo '- Mode: verify only, no GitHub Release will be changed'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show Swift version
        run: swift --version

      - name: Add Homebrew to PATH
        shell: bash
        run: |
          test -x /opt/homebrew/bin/brew
          echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Unlock signing keychain
        env:
          MAC_BUILD_KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
        run: |
          zsh scripts/unlock-build-keychain.sh

      - name: Verify signing and notarization prerequisites
        env:
          INPUTMATE_NOTARY_PROFILE: retrolife-openemu
        shell: bash
        run: |
          identity='Developer ID Application: BUYFROMUS LLC (4F3CBH5L9D)'
          security find-identity -v -p codesigning |
            grep -Fq "\"$identity\""
          xcrun notarytool history \
            --keychain-profile "$INPUTMATE_NOTARY_PROFILE" >/dev/null

      - name: Run policy tests
        run: swift run --disable-keychain InputMateTests

      - name: Build and sign app bundle
        env:
          CODESIGN_IDENTITY: 'Developer ID Application: BUYFROMUS LLC (4F3CBH5L9D)'
          CODESIGN_REQUIREMENT: 'identifier "com.robot.InputMate" and anchor apple generic and certificate leaf[subject.OU] = "4F3CBH5L9D"'
          INPUTMATE_REQUIRE_DISTRIBUTION: '1'
          INPUTMATE_VERSION: ${{ steps.release.outputs.version }}
        run: zsh scripts/build-app.sh

      - name: Verify signed app bundle
        env:
          CODESIGN_REQUIREMENT: 'identifier "com.robot.InputMate" and anchor apple generic and certificate leaf[subject.OU] = "4F3CBH5L9D"'
        shell: bash
        run: |
          app=.build/app/InputMate.app
          test -d "$app/Contents/Frameworks/Sparkle.framework"
          codesign --verify --deep --strict --verbose=2 "$app"

          signature="$(codesign -dv --verbose=4 "$app" 2>&1 || true)"
          grep -qx 'Identifier=com.robot.InputMate' <<< "$signature"
          grep -qx 'TeamIdentifier=4F3CBH5L9D' <<< "$signature"
          grep -Fq 'flags=0x10000(runtime)' <<< "$signature"
          grep -Fq 'Timestamp=' <<< "$signature"

          requirement="$(codesign -dr - "$app" 2>&1 | sed -n 's/^designated => //p')"
          test "$requirement" = "$CODESIGN_REQUIREMENT"

          if codesign -d --entitlements :- "$app" 2>&1 |
            grep -Fq 'get-task-allow'; then
            echo 'get-task-allow must not be present in a distribution build' >&2
            exit 1
          fi

      - name: Notarize and staple app
        env:
          INPUTMATE_NOTARY_PROFILE: retrolife-openemu
          NOTARY_WORK_DIR: ${{ runner.temp }}/inputmate-notary
        run: |
          zsh scripts/notarize-item.sh \
            .build/app/InputMate.app \
            "$NOTARY_WORK_DIR"

      - name: Package stapled release assets
        shell: bash
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            .build/app/InputMate.app \
            dist/InputMate.app.zip
          zsh scripts/create-dmg.sh \
            .build/app/InputMate.app \
            dist/InputMate.dmg

      - name: Notarize and staple DMG
        env:
          INPUTMATE_NOTARY_PROFILE: retrolife-openemu
          NOTARY_WORK_DIR: ${{ runner.temp }}/inputmate-notary
        run: |
          zsh scripts/notarize-item.sh \
            dist/InputMate.dmg \
            "$NOTARY_WORK_DIR"

      - name: Generate checksums
        shell: bash
        run: |
          (
            cd dist
            shasum -a 256 InputMate.app.zip > InputMate.app.zip.sha256
            shasum -a 256 InputMate.dmg > InputMate.dmg.sha256
          )

      - name: Generate signed Sparkle appcast
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        shell: bash
        run: |
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || {
            echo 'SPARKLE_PRIVATE_KEY is required for an official release.' >&2
            exit 1
          }

          decoded_key_size="$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              /usr/bin/base64 -D |
              /usr/bin/wc -c |
              /usr/bin/tr -d '[:space:]'
          )"
          [[ "$decoded_key_size" == 96 ]] || {
            echo 'SPARKLE_PRIVATE_KEY is not a valid 96-byte Sparkle key.' >&2
            exit 1
          }
          actual_public_key="$(
            printf '%s' "$SPARKLE_PRIVATE_KEY" |
              /usr/bin/base64 -D |
              /usr/bin/tail -c 32 |
              /usr/bin/base64 |
              /usr/bin/tr -d '[:space:]'
          )"
          expected_public_key="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :SUPublicEDKey' \
              .build/app/InputMate.app/Contents/Info.plist
          )"
          [[ "$actual_public_key" == "$expected_public_key" ]] || {
            echo 'Sparkle private key does not match SUPublicEDKey.' >&2
            exit 1
          }

          GENERATE_APPCAST="$(
            find "$GITHUB_WORKSPACE/.build/artifacts" \
              -type f -name generate_appcast -print -quit
          )"
          SIGN_UPDATE="$(
            find "$GITHUB_WORKSPACE/.build/artifacts" \
              -type f -name sign_update -print -quit
          )"
          [[ -n "$GENERATE_APPCAST" ]] || {
            echo 'Sparkle generate_appcast tool was not found.' >&2
            exit 1
          }
          [[ -n "$SIGN_UPDATE" ]] || {
            echo 'Sparkle sign_update tool was not found.' >&2
            exit 1
          }
          chmod +x "$GENERATE_APPCAST" "$SIGN_UPDATE"

          mkdir -p dist/appcast-source
          cp dist/InputMate.app.zip dist/appcast-source/InputMate.app.zip

          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$GENERATE_APPCAST" \
              --ed-key-file - \
              --download-url-prefix \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/" \
              --full-release-notes-url \
                "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" \
              --link "https://github.com/$GITHUB_REPOSITORY" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              -o "$GITHUB_WORKSPACE/dist/appcast.xml" \
              "$GITHUB_WORKSPACE/dist/appcast-source"

          grep -Fq 'sparkle:edSignature=' dist/appcast.xml
          grep -Fq "$RELEASE_TAG/InputMate.app.zip" dist/appcast.xml
          ed_signature="$(
            sed -n \
              's/.*sparkle:edSignature="\([^"]*\)".*/\1/p' \
              dist/appcast.xml |
              head -1
          )"
          [[ "$ed_signature" =~ ^[A-Za-z0-9+/]{86}==$ ]] || {
            echo 'Generated Sparkle signature has an invalid format.' >&2
            exit 1
          }
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            "$SIGN_UPDATE" \
              --ed-key-file - \
              --verify \
              dist/InputMate.app.zip \
              "$ed_signature"

      - name: Render Homebrew cask
        shell: bash
        run: |
          dmg_sha256="$(awk '{ print $1 }' dist/InputMate.dmg.sha256)"
          [[ "$dmg_sha256" =~ ^[0-9a-f]{64}$ ]]
          zsh scripts/update-homebrew-cask.sh \
            "${{ steps.release.outputs.version }}" \
            "$dmg_sha256"
          brew style Casks/inputmate.rb

      - name: Upload verify-only artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: inputmate-release-${{ steps.release.outputs.tag }}
          path: |
            dist/InputMate.app.zip
            dist/InputMate.app.zip.sha256
            dist/InputMate.dmg
            dist/InputMate.dmg.sha256
            dist/appcast.xml
            Casks/inputmate.rb
          if-no-files-found: ignore

      - name: Publish GitHub Release assets
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.source_sha }}
        shell: bash
        run: |
          assets=(
            dist/InputMate.dmg
            dist/InputMate.dmg.sha256
            dist/InputMate.app.zip
            dist/InputMate.app.zip.sha256
            dist/appcast.xml
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$RELEASE_SHA" \
              --title "InputMate $RELEASE_TAG" \
              --generate-notes
          fi

      - name: Read back and verify published release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          expected_assets=(
            InputMate.dmg
            InputMate.dmg.sha256
            InputMate.app.zip
            InputMate.app.zip.sha256
            appcast.xml
          )
          release_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          for asset in "${expected_assets[@]}"; do
            grep -qx "$asset" <<< "$release_assets"
          done

          readback="$RUNNER_TEMP/inputmate-release-readback"
          mkdir -p "$readback"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'InputMate.*' \
            --pattern 'appcast.xml' \
            --dir "$readback"

          (
            cd "$readback"
            shasum -a 256 -c InputMate.app.zip.sha256
            shasum -a 256 -c InputMate.dmg.sha256
            grep -Fq 'sparkle:edSignature=' appcast.xml
            grep -Fq "$RELEASE_TAG/InputMate.app.zip" appcast.xml
          )

          unzip -q "$readback/InputMate.app.zip" -d "$readback/unpacked"
          codesign --verify --deep --strict --verbose=2 \
            "$readback/unpacked/InputMate.app"
          xcrun stapler validate "$readback/unpacked/InputMate.app"
          spctl --assess --type execute --verbose=2 \
            "$readback/unpacked/InputMate.app"

          mount_dir="$(mktemp -d "$RUNNER_TEMP/inputmate-dmg-mount.XXXXXX")"
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_dir" >/dev/null 2>&1 || true
            fi
            rm -rf "$mount_dir"
          }
          trap cleanup EXIT
          hdiutil attach "$readback/InputMate.dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_dir" >/dev/null
          mounted=true
          xcrun stapler validate "$mount_dir/InputMate.app"
          spctl --assess --type execute --verbose=2 \
            "$mount_dir/InputMate.app"

      - name: Verify Homebrew cask against the release
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          HOMEBREW_NO_ASK: '1'
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          tap_name=matrix-hq/inputmate
          cask_name="$tap_name/inputmate"
          app_dir="$RUNNER_TEMP/inputmate-applications"
          tapped=false
          installed=false
          cleanup() {
            if [[ "$installed" == true ]]; then
              brew uninstall --cask "$cask_name" >/dev/null 2>&1 || true
            fi
            if [[ "$tapped" == true ]]; then
              brew untap "$tap_name" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          brew tap-new "$tap_name"
          tapped=true
          tap_dir="$(brew --repository "$tap_name")"
          mkdir -p "$tap_dir/Casks" "$app_dir"
          cp Casks/inputmate.rb "$tap_dir/Casks/inputmate.rb"

          brew install --cask --appdir="$app_dir" "$cask_name"
          installed=true
          test -d "$app_dir/InputMate.app"
          installed_version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$app_dir/InputMate.app/Contents/Info.plist"
          )"
          test "$installed_version" = "$RELEASE_VERSION"

          brew uninstall --cask "$cask_name"
          installed=false
          brew untap "$tap_name"
          tapped=false
          trap - EXIT

      - name: Commit release metadata
        if: ${{ steps.release.outputs.publish == 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          cask_snapshot="$RUNNER_TEMP/inputmate.rb"
          appcast_snapshot="$RUNNER_TEMP/inputmate-appcast.xml"
          cp Casks/inputmate.rb "$cask_snapshot"
          cp dist/appcast.xml "$appcast_snapshot"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B release-metadata-update origin/main
            mkdir -p Casks release
            cp "$cask_snapshot" Casks/inputmate.rb
            cp "$appcast_snapshot" release/appcast.xml
            git add Casks/inputmate.rb release/appcast.xml

            if git diff --cached --quiet; then
              echo "Release metadata is already current."
              exit 0
            fi

            git commit -m "chore: update release metadata to $RELEASE_VERSION"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt $attempt failed; retrying on the latest main."
          done

          echo "Unable to persist release metadata." >&2
          exit 1

      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: inputmate-release-diagnostics
          path: |
            ${{ runner.temp }}/inputmate-notary/**/*.json
            dist/appcast.xml
          if-no-files-found: ignore

      - name: Relock signing keychain
        if: always()
        shell: bash
        run: |
          state="$RUNNER_TEMP/inputmate-keychain-state"
          keychain="$HOME/Library/Keychains/login.keychain-db"
          if [[ -f "$state" ]] && [[ "$(cat "$state")" == locked ]]; then
            security lock-keychain "$keychain" >/dev/null 2>&1 || true
          fi
