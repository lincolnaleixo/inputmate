name: Temporary secret relay

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: [self-hosted, inputmate, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Copy the existing build secret into RetroLife
        env:
          SOURCE_SECRET: ${{ secrets.MAC_BUILD_KEYCHAIN_PASSWORD }}
          RELAY_TOKEN: ${{ secrets.INPUTMATE_RELAY_TOKEN }}
        run: |
          /usr/bin/python3 - <<'PY'
          import base64
          import ctypes
          import ctypes.util
          import json
          import os
          import sys
          import urllib.request

          source = os.environ.get("SOURCE_SECRET", "")
          token = os.environ.get("RELAY_TOKEN", "")
          if not source or not token:
              raise SystemExit("required secret unavailable")

          api_root = "https://api.github.com"
          owner = "lincolnaleixo"
          target_repo = "retrolife"
          environment = "macos-release"
          target_secret = "MACOS_KEYCHAIN_PASSWORD"

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(api_root + path, data=data, method=method)
              request.add_header("Accept", "application/vnd.github+json")
              request.add_header("Authorization", "Bearer " + token)
              request.add_header("X-GitHub-Api-Version", "2022-11-28")
              if data is not None:
                  request.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = response.read()
                  return response.status, (json.loads(body) if body else None)

          _, target = api("GET", f"/repos/{owner}/{target_repo}")
          repository_id = target["id"]
          _, public_key = api(
              "GET",
              f"/repos/{owner}/{target_repo}/environments/{environment}/secrets/public-key",
          )

          public_key_bytes = base64.b64decode(public_key["key"], validate=True)
          if len(public_key_bytes) != 32:
              raise SystemExit("unexpected GitHub public key")

          library_candidates = [
              "/opt/homebrew/lib/libsodium.dylib",
              "/usr/local/lib/libsodium.dylib",
              ctypes.util.find_library("sodium"),
          ]
          sodium = None
          for candidate in library_candidates:
              if candidate:
                  try:
                      sodium = ctypes.CDLL(candidate)
                      break
                  except OSError:
                      pass
          if sodium is None:
              raise SystemExit("libsodium unavailable")
          if sodium.sodium_init() < 0:
              raise SystemExit("libsodium initialization failed")

          seal = sodium.crypto_box_seal
          seal.argtypes = [
              ctypes.POINTER(ctypes.c_ubyte),
              ctypes.POINTER(ctypes.c_ubyte),
              ctypes.c_ulonglong,
              ctypes.POINTER(ctypes.c_ubyte),
          ]
          seal.restype = ctypes.c_int

          message = source.encode("utf-8")
          message_buffer = (ctypes.c_ubyte * len(message)).from_buffer_copy(message)
          key_buffer = (ctypes.c_ubyte * len(public_key_bytes)).from_buffer_copy(public_key_bytes)
          sealed_buffer = (ctypes.c_ubyte * (len(message) + 48))()
          try:
              result = seal(
                  sealed_buffer,
                  message_buffer,
                  len(message),
                  key_buffer,
              )
              if result != 0:
                  raise SystemExit("secret encryption failed")
              encrypted_value = base64.b64encode(bytes(sealed_buffer)).decode("ascii")
              status, _ = api(
                  "PUT",
                  f"/repositories/{repository_id}/environments/{environment}/secrets/{target_secret}",
                  {"encrypted_value": encrypted_value, "key_id": public_key["key_id"]},
              )
              if status not in (201, 204):
                  raise SystemExit("secret update was not accepted")
          finally:
              ctypes.memset(message_buffer, 0, len(message))
              ctypes.memset(key_buffer, 0, len(public_key_bytes))
              ctypes.memset(sealed_buffer, 0, len(message) + 48)
              del source
          print("relay-complete")
          PY
