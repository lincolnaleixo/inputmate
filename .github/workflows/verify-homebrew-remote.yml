name: Verify public Homebrew installation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-homebrew-remote.yml

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      HOMEBREW_NO_ASK: '1'

    steps:
      - name: Install through the public tap
        shell: bash
        run: |
          tap_name=matrix-hq/inputmate
          cask_name="$tap_name/inputmate"
          tapped=false
          installed=false
          cleanup() {
            if [[ "$installed" == true ]]; then
              brew uninstall --cask "$cask_name" >/dev/null 2>&1 || true
            fi
            if [[ "$tapped" == true ]]; then
              brew untap "$tap_name" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          brew tap "$tap_name" https://github.com/matrix-hq/inputmate
          tapped=true
          brew install --cask "$cask_name"
          installed=true

          test -d /Applications/InputMate.app
          version="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              /Applications/InputMate.app/Contents/Info.plist
          )"
          test "$version" = "0.1.1"

          brew uninstall --cask "$cask_name"
          installed=false
          brew untap "$tap_name"
          tapped=false
          trap - EXIT

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh pr comment 10 \
            --repo "$GITHUB_REPOSITORY" \
            --body "homebrew-public-run:${GITHUB_RUN_ID} version:0.1.1 status:success"
